name: Daily ETL and Power BI Refresh

on:
  schedule:
    - cron: "0 5 * * *" # 12:00 Hanoi time (05:00 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: hbc-data-storage-writer
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore current warehouse
        run: |
          git fetch origin data-storage
          git show origin/data-storage:hbc_data_warehouse.duckdb > hbc_data_warehouse.duckdb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || pip install requests duckdb pandas pyarrow python-dotenv

      - name: Run ETL
        env:
          MISA_BASE_URL: ${{ secrets.MISA_BASE_URL }}
          MISA_CLIENT_ID: ${{ secrets.MISA_CLIENT_ID }}
          MISA_CLIENT_SECRET: ${{ secrets.MISA_CLIENT_SECRET }}
          DUCKDB_PATH: hbc_data_warehouse.duckdb
        run: python etl_misa.py

      - name: Prepare Data for Storage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to data-storage branch if it doesn't exist
          git checkout -B data-storage

          # Keep only the database and necessary files if needed, or just commit the DB
          # For Power BI, it's best to have the DB at the root of this branch
          git add -f hbc_data_warehouse.duckdb
          git commit -m "Automated Data Update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin data-storage --force

      - name: Trigger Power BI Refresh
        if: success()
        env:
          PBI_TENANT_ID: ${{ secrets.PBI_TENANT_ID }}
          PBI_CLIENT_ID: ${{ secrets.PBI_CLIENT_ID }}
          PBI_CLIENT_SECRET: ${{ secrets.PBI_CLIENT_SECRET }}
          PBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE_ID }}
          PBI_DATASET_ID: ${{ secrets.PBI_DATASET_ID }}
        run: bash scripts/trigger_power_bi_refresh.sh
